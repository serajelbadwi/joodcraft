name: joodcraft
description: "JoodCraft - منصة توليد الشهادات والعقود الرسمية بالجملة"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  intl: any
  supabase_flutter: ^2.17.2
  provider: ^6.1.5+1
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  file_picker: ^13.1.0
  flutter_colorpicker: ^1.1.0
  go_router: ^17.5.0
  # محرك تشكيل الحروف العربية + خوارزمية BiDi (يستخدمه محرّك الـ PDF).
  bidi: ^2.0.13
  barcode: ^2.2.9
  qr: ^3.0.2
  # تخزين محلي للخطوط المخصصة التي يرفعها المستخدم (ملف JSON في مجلد بيانات
  # التطبيق على سطح المكتب، وlocalStorage على الويب) — بلا أي شبكة.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  integration_test:
    sdk: flutter

# تهيئة توليد أيقونة التطبيق الرسمية لكل المنصات من الصورة الموجودة في الأسيتس.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon.png"
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/icon.png"
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

flutter:
  # توليد كلاس الترجمة تلقائياً عند البناء (انظر l10n.yaml).
  generate: true
  # The following line ensures that the Material Icons font is
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/images/
    - assets/templates/
    # مفاتيح Supabase تُقرأ تلقائياً وقت التشغيل — بلا أي علامة تشغيل:
    # أولاً من القرص أثناء التطوير، ثم من هذه الحزمة في نسخ الإنتاج.
    # مجلد مُعلن كأصل (وليس ملفاً بذاته): وجود المجلد يكفي للبناء، وغياب
    # الملف داخله لا يُسقط البناء — يُقرأ من القرص أثناء التطوير ثم من الحزمة.
    # أنشئ الملف من env.example.json عبر: dart run tool/ensure_env.dart
    - assets/env/

  # الخطوط العربية محزومة داخل التطبيق — لا يُجلب أي خط من الشبكة إطلاقاً.
  # المصدر: Google Fonts CDN (تم التحقق من بصمة SHA-256 لكل ملف عند التنزيل)،
  # والترخيص SIL Open Font License 1.1 (ملف OFL.txt بجانب كل خط).
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/amiri/Amiri-Bold.ttf
          weight: 700
    # خط الـ PDF الأساسي: sans حديث بتغطية كاملة (117/117) لصور الحروف المتصلة.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Tajawal: sans عربي هندسي — تغطية 117/117 بعد معالجة جدول cmap.
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 600
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
    # Noto Sans Arabic: تغطية عربية هي الأوسع — 117/117.
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/noto_sans_arabic/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_sans_arabic/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/noto_sans_arabic/NotoSansArabic-Bold.ttf
          weight: 700
    # خط الصينية الاحتياطي: محزوم ومُصغَّر من Noto Sans SC (2.19MB بدل 17MB).
    # يتصدّر fontFamilyFallback فلا تظهر مربعات فارغة (□□□) عند تشغيل
    # الواجهة بالصينية، خاصة على الويب حيث لا خطوط نظام مضمونة.
    # أعد التوليد بـ: python tool/subset_cjk_font.py
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/noto_sans_sc/NotoSansSC-Regular.ttf
          weight: 400
    # خط السيريلية الاحتياطي: محزوم ومُصغَّر من Noto Sans (‎~64KB) — يغطي كامل
    # الكتلة السيريلية U+0400..U+052F لأن خط الصينية أعلاه لا يملك إلا الأبجدية
    # الروسية الأساسية، ولا خط محزوم آخر يغطي السيريلية.
    # أعد التوليد بـ: python tool/subset_cyrillic_font.py
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/noto_sans/NotoSans-Cyrillic.ttf
          weight: 400

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
